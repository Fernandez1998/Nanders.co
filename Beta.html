<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nanders Photography</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .background-image {
      background-image: url('your-image.jpg'); /* Replace with your image path */
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100%;
      position: absolute;
      z-index: -1;
    }

    .banner-container {
      height: 60px; /* Hover zone */
    }

    .top-banner {
      background-color: rgba(76, 175, 80, 0.95);
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .banner-container:hover .top-banner {
      opacity: 1;
      pointer-events: auto;
    }

    .banner-left {
      flex: 1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .banner-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: transparent;
      color: white;
      padding: 10px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1001;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown:hover .dropbtn {
      background-color: rgba(76, 175, 80, 0.8);
    }

    .content {
      padding: 100px 20px;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    p {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="background-image"></div>

  <div class="banner-container">
    <div class="top-banner">
      <div class="banner-left">
        <div class="dropdown">
          <button class="dropbtn">Menu</button>
          <div class="dropdown-content">
            <a href="#home">Home</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
          </div>
        </div>
      </div>
      <div class="banner-center">Nanders Photography</div>
    </div>
  </div>

  <div class="content">
    <h1>Welcome to Nanders Photography</h1>
    <p>Hover at the top of the page to see the menu and banner.</p>
  </div>

</body>
</html>
